# Arabic Translator Configuration
# ================================
# This file configures the bidirectional MSA ↔ Shami translation pipeline.

# Model Settings
# --------------
model_name: "QCRI/Fanar-1-9B-Instruct" #"jais-70b-local"  # HuggingFace model name or local path
tensor_parallel_size: 1                       # Number of GPUs for tensor parallelism
gpu_memory_utilization: 0.9                   # GPU memory fraction to use (0.0-1.0)
dtype: "auto"                                 # Data type: "auto", "float16", "bfloat16"
enforce_eager: true  
# Inference Parameters
# --------------------
temperature: 0.0          # Lower = more deterministic, higher = more creative
max_tokens: 32           # Maximum tokens to generate per translation
top_p: 0.9                # Nucleus sampling threshold
top_k: 50                 # Top-k sampling limit
repetition_penalty: 1.3   # Penalty for token repetition (1.0 = no penalty)

# Processing Settings
# -------------------
batch_size: 128            # Number of translations per batch
input_file: "data/shami_v2.csv"   # Input CSV file path
output_dir: "outputs"           # Directory for output files

# Prompt Templates
# ----------------
# Use {text} as placeholder for the source text
shami_to_msa_template: |
  You are a translation engine. Convert Modern Standard Arabic (MSA) into Syrian Arabic (Shami).

  HARD CONSTRAINTS (must follow):
  - Output ONLY the Shami translation. Nothing else.
  - Output Arabic script ONLY. No English letters/words at all.
  - No diacritics/harakat/tashkeel and no decorative characters (no َ ً ُ ٌ ِ ٍ ْ ّ and no ـ).
  - Do NOT add explanations, notes, labels, alternatives, or examples.
  - Do NOT add or remove sentences. Keep the same meaning and same content.
  - Keep names, numbers, dates, symbols, and emojis unchanged.

  STYLE:
  - Translate meaning, not word-for-word.

  Shami: {text}
  MSA:

msa_to_shami_template: |
  You are a translation engine. Convert Syrian Arabic (Shami) to Modern Standard Arabic (MSA).

  HARD CONSTRAINTS (must follow):
  - Output ONLY the Shami translation. Nothing else.
  - Output Arabic script ONLY. No English letters/words at all.
  - No diacritics/harakat/tashkeel and no decorative characters (no َ ً ُ ٌ ِ ٍ ْ ّ and no ـ).
  - Do NOT add explanations, notes, labels, alternatives, or examples.
  - Do NOT add or remove sentences. Keep the same meaning and same content.
  - Keep names, numbers, dates, symbols, and emojis unchanged.

  STYLE:
  - Translate meaning, not word-for-word.

  MSA: {text}
  Shami:


# CSV Column Names
# ----------------
# Adjust these if your input CSV uses different column headers
id_column: "sentID.BTEC"
shami_column: "Shami-sent"
msa_column: "MSA-sent"
